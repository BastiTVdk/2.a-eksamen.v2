<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opgavebank - Sankt Annæ 2.a</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap');
        
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #020617;
            --glass: rgba(15, 23, 42, 0.7);
            --glass-hover: rgba(30, 41, 59, 0.8);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #f1f5f9;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(168, 85, 247, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.05) 0%, transparent 60%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .filter-btn {
            transition: all 0.2s ease;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        code {
            font-family: 'Fira Code', monospace;
            color: #a5b4fc;
            background: rgba(0, 0, 0, 0.4);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.9em;
            border: 1px solid rgba(255, 255, 255, 0.1);
            letter-spacing: -0.5px;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .animate-slide {
            animation: slideIn 0.4s ease forwards;
        }

        .animate-shake {
            animation: shake 0.4s ease;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }
    </style>
</head>

        // --- STATE & LOGIK ---
        let currentFilter = 'all';
        let activeQuestions = [];
        let currentQuestionObj = null;
        let solvedIds = JSON.parse(localStorage.getItem('mapleQuizDone')) || [];

        const container = document.getElementById('exercise-container');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // Initialisering
        function init() {
            setFilter('all');
            updateProgressUI();
            
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => {
                        b.classList.remove('active');
                        b.classList.replace('text-white', 'text-slate-300');
                    });
                    btn.classList.add('active');
                    btn.classList.replace('text-slate-300', 'text-white');
                    
                    setFilter(btn.getAttribute('data-filter'));
                });
            });
        }

        // Sæt kategori og find ny opgave
        function setFilter(category) {
            currentFilter = category;
            
            if (category === 'all') {
                activeQuestions = [...allExercises];
            } else {
                activeQuestions = allExercises.filter(q => q.category === category || (category === 'diff' && q.categoryName === 'Optimering'));
            }
            
            pickNextQuestion();
        }

        // Vælg næste uløste opgave i den aktuelle kategori
        function pickNextQuestion() {
            const unsolved = activeQuestions.filter(q => !solvedIds.includes(q.id));
            
            if (unsolved.length === 0) {
                renderAllDoneMessage();
            } else {
                // Vælg den første uløste (man kunne også gøre det tilfældigt)
                currentQuestionObj = unsolved[0];
                renderQuestion(currentQuestionObj);
            }
        }

        // Opdater Progress Bar
        function updateProgressUI() {
            const total = allExercises.length;
            const solved = solvedIds.length;
            const pct = Math.round((solved / total) * 100);

            document.getElementById('progress-text').innerText = `${solved} / ${total} løst`;
            document.getElementById('progress-percent').innerText = `${pct}%`;
            document.getElementById('progress-bar-fill').style.width = `${pct}%`;

            if (pct === 100) {
                document.getElementById('progress-bar-fill').classList.replace('from-indigo-500', 'from-emerald-400');
                document.getElementById('progress-bar-fill').classList.add('shadow-[0_0_15px_rgba(16,185,129,0.5)]');
            }
        }

        // Rengør brugerens input for at tjekke svaret (fjerner mellemrum, sætter til små bogstaver, ændrer komma til punktum)
        function normalizeAnswer(ans) {
            return ans.toLowerCase().replace(/ /g, '').replace(/,/g, '.');
        }

        // Tjek svar når knappen trykkes
        function checkAnswer() {
            const inputField = document.getElementById('answer-input');
            const feedbackBox = document.getElementById('feedback-box');
            
            const userAnswer = normalizeAnswer(inputField.value);
            const correctAnswer = normalizeAnswer(currentQuestionObj.expectedAnswer);

            if (userAnswer === '') return;

            if (userAnswer === correctAnswer) {
                // RIGTIGT SVAR
                inputField.disabled = true;
                
                // Gem progress
                if (!solvedIds.includes(currentQuestionObj.id)) {
                    solvedIds.push(currentQuestionObj.id);
                    localStorage.setItem('mapleQuizDone', JSON.stringify(solvedIds));
                    updateProgressUI();
                }

                feedbackBox.innerHTML = `
                    <div class="p-5 bg-emerald-500/10 border border-emerald-500/40 rounded-xl animate-slide">
                        <div class="flex items-center text-emerald-400 font-bold text-lg mb-2">
                            <i class="fas fa-check-circle mr-2 text-xl"></i> Rigtigt! Super godt gået.
                        </div>
                        <p class="text-sm text-slate-300 mb-4">${currentQuestionObj.method}</p>
                        <button onclick="pickNextQuestion()" class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-black rounded-lg transition-colors">
                            Næste Opgave <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                `;
            } else {
                // FORKERT SVAR
                container.classList.remove('animate-shake');
                void container.offsetWidth; // Trigger reflow for animation
                container.classList.add('animate-shake');
                
                feedbackBox.innerHTML = `
                    <div class="p-4 bg-rose-500/10 border border-rose-500/40 rounded-xl text-rose-300 flex items-center animate-slide">
                        <i class="fas fa-times-circle mr-3 text-xl"></i> 
                        <span>Ikke helt rigtigt. Prøv at tjekke dine beregninger igen. Husk formatet (f.eks. y=ax+b uden mellemrum, eller punktum i stedet for komma).</span>
                    </div>
                `;
            }
        }

        // Håndter "Enter" knap i inputfelt
        function handleEnter(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        }

        // Render selve opgave-kortet
        function renderQuestion(q) {
            container.classList.remove('animate-slide');
            void container.offsetWidth;
            container.classList.add('animate-slide');

            let codeHtml = '';
            if (q.code) {
                const codeLines = q.code.split('\n');
                codeHtml = `<div class="mb-5">` + codeLines.map(line => `<code class="block mb-1">${line}</code>`).join('') + `</div>`;
            }

            container.innerHTML = `
                <div class="flex justify-between items-start mb-6">
                    <span class="px-3 py-1 text-xs font-bold rounded-lg border ${q.badgeColor}">${q.categoryName}</span>
                    <span class="text-slate-500 font-mono text-sm">#${q.id.replace('opg-', '')}</span>
                </div>
                
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-4">${q.title}</h2>
                <p class="text-slate-300 text-base md:text-lg mb-4 leading-relaxed">${q.text}</p>
                
                ${codeHtml}
                
                <div class="bg-indigo-900/20 border-l-4 border-indigo-500 p-4 rounded-r-xl mb-8">
                    <p class="font-bold text-indigo-100">${q.question}</p>
                </div>

                <div class="mt-auto">
                    <div class="flex flex-col md:flex-row gap-3 mb-4">
                        <input type="text" id="answer-input" onkeypress="handleEnter(event)" placeholder="Indtast dit svar her..." autocomplete="off"
                            class="flex-1 bg-slate-900/80 border border-white/10 px-5 py-4 rounded-xl text-white font-mono text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all shadow-inner">
                        <button onclick="checkAnswer()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-8 py-4 rounded-xl transition-colors shadow-lg shadow-indigo-500/20 flex items-center justify-center">
                            Tjek Svar <i class="fas fa-check ml-2"></i>
                        </button>
                    </div>
                    <div id="feedback-box"></div>
                </div>
            `;
            
            // Sæt fokus på input med det samme
            setTimeout(() => document.getElementById('answer-input').focus(), 100);
        }

        // Render besked når alt er løst
        function renderAllDoneMessage() {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center py-10 animate-slide">
                    <div class="w-20 h-20 bg-emerald-500/20 rounded-full flex items-center justify-center mb-6 border border-emerald-500/40">
                        <i class="fas fa-trophy text-4xl text-emerald-400"></i>
                    </div>
                    <h2 class="text-3xl font-black text-white mb-3">Stærkt gået!</h2>
                    <p class="text-slate-300 max-w-md mx-auto mb-8">Du har løst alle de tilgængelige opgaver i denne kategori. Du er mere end klar til eksamen.</p>
                    <button onclick="setFilter('all')" class="px-6 py-3 bg-white/10 hover:bg-white/20 rounded-xl font-bold transition-colors">
                        Se alle opgaver
                    </button>
                </div>
            `;
        }

        // Start!
        init();

    </script>
